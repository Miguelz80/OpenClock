[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openclock"
version = "0.1.0.dev0"
description = "Garmin and Apple Watch workouts for AI assistants, through the Model Context Protocol."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "OpenClock contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "defusedxml>=0.7",
    "garmin-fit-sdk>=21.0",
    "mcp>=2.3,<3",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Mode B: the Telegram bot and its Claude-powered assistant.
bot = [
    "anthropic>=2.10,<3",
    "httpx2>=2.10",
]
dev = [
    "anthropic>=2.10,<3",
    "httpx2>=2.10",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
openclock = "openclock.cli:main"
openclock-mcp = "openclock.mcp_server:main"
openclock-telegram = "openclock.channels.telegram:main"

[project.urls]
Homepage = "https://github.com/Miguelz80/OpenClock"
Issues = "https://github.com/Miguelz80/OpenClock/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
